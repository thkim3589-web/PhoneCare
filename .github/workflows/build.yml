name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          if [ ! -f settings.gradle.kts ] && ls *.zip >/dev/null 2>&1; then
            unzip -o -q "$(ls *.zip | head -1)" -d .
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 정식 서명 키 (GitHub Secrets에 등록돼 있을 때만)
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the official release key"
          else
            echo "No release key registered - signing with the test key"
          fi

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 커밋 메시지에 [lint]가 있으면 코드 검사 실행 → 결과를 '사전 릴리스'로 올림 (앱 업데이트에는 안 잡힘)
      - name: Lint check
        if: contains(github.event.head_commit.message, '[lint]')
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew lintDebug --no-daemon
          cp app/build/lint-results.txt lint-results.txt || echo "no report" > lint-results.txt

      - uses: softprops/action-gh-release@v2
        if: contains(github.event.head_commit.message, '[lint]')
        with:
          tag_name: lint-${{ github.run_number }}
          name: 코드 검사 ${{ github.run_number }}
          prerelease: true
          files: lint-results.txt

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneCare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCare-apk
          path: PhoneCare.apk

      - uses: softprops/action-gh-release@v2
        if: "!contains(github.event.head_commit.message, '[lint]')"
        with:
          tag_name: build-${{ github.run_number }}
          name: PhoneCare build ${{ github.run_number }}
          files: PhoneCare.apk

      # 빌드가 실패하면 오류 로그를 '사전 릴리스'로 올려서 원인을 바로 확인 (앱 업데이트에는 안 잡힘)
      - name: Collect failure log
        if: failure()
        run: |
          touch build.log
          grep -nE "^e: |error:|FAILURE|What went wrong" -A 3 build.log > build-errors.txt || true
          tail -n 200 build.log >> build-errors.txt

      - uses: softprops/action-gh-release@v2
        if: failure()
        with:
          tag_name: fail-${{ github.run_number }}
          name: 빌드 실패 기록 ${{ github.run_number }}
          prerelease: true
          files: build-errors.txt
